<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HDHR 워크숍</title>
  <link rel="stylesheet" href="assets/home.css" />
</head>
<body>
  <header class="hero">
    <h1 class="hero__title">HDHR 워크숍</h1>
    <p class="hero__desc">이 저장소에 올린 실습물 목록입니다. 카드를 눌러 각 페이지로 이동하세요.</p>
  </header>

  <main class="grid">
    <!--
      새 실습물을 추가할 때:
      1) 저장소 루트에 폴더를 하나 만들고 그 안에 index.html 을 둡니다. (예: timesheet/index.html)
      2) 아래 <a class="card"> 블록을 복사해 href 와 문구만 바꿉니다.
      3) 커밋 후 푸시하면 https://chaejwan.github.io/HDHR_CJW/폴더이름/ 으로 열립니다.
    -->
    <a class="card" href="monitor/">
      <span class="card__icon" aria-hidden="true">🔔</span>
      <h2 class="card__title">채용공고 모니터</h2>
      <p class="card__desc">지정한 채용 사이트를 GitHub Actions 가 주기적으로 확인해, 새 공고가 올라오면 이메일로 알려 줍니다. 이 화면에서 사이트·주기·수신 이메일을 바꿉니다.</p>
      <span class="card__go">열기 →</span>
    </a>

    <a class="card" href="survey/">
      <span class="card__icon" aria-hidden="true">📝</span>
      <h2 class="card__title">설문조사 양식</h2>
      <p class="card__desc">항목과 답변을 자유롭게 추가해 설문지를 만들고, 미리보기 탭에서 바로 응답까지 해볼 수 있습니다.</p>
      <span class="card__go">열기 →</span>
    </a>
  </main>

  <footer class="foot">
    <a href="https://github.com/chaejwan/HDHR_CJW">GitHub 저장소 보기</a>
  </footer>
</body>
</html>
